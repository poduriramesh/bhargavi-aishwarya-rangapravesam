<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bhargavi & Aishwarya Poduri | Kuchipudi Rangapravesam</title>

<style>

:root{
  --navy:#081D58;
  --royal:#1E2A8A;
  --gold:#D4AF37;
  --ivory:#FFFDF7;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Segoe UI, Arial, sans-serif;
  background:var(--ivory);
  color:#222;
  line-height:1.6;
}

.section{
  padding:24px 18px;
}

.center{
  text-align:center;
}

h1,h2,h3{
  color:var(--royal);
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.countdown{
  background:var(--royal);
  color:white;
  text-align:center;
  padding:25px;
}

.count{
  font-size:52px;
  font-weight:bold;
  color:var(--gold);
}

.quick{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.quick-card{
  background:white;
  border-radius:16px;
  padding:18px;
  text-align:center;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.two-column{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.timeline-item{
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.timeline-item:last-child{
  border-bottom:none;
}

.highlight{
  color:var(--gold);
  font-weight:bold;
}

.hero-image{
  width:100%;
  max-width:700px;
  display:block;
  margin:auto;
  border-radius:18px;
  box-shadow:0 6px 24px rgba(0,0,0,.15);
}

details summary{
  cursor:pointer;
  font-weight:bold;
  color:var(--royal);
}

footer{
  background:var(--navy);
  color:white;
  text-align:center;
  padding:30px;
  margin-top:30px;
}

a{
  text-decoration:none;
  color:inherit;
}

</style>
</head>

<body>

<!-- HEADER -->

<section class="section center">

<h1>Bhargavi & Aishwarya Poduri</h1>

<p style="font-size:1.2rem;margin-top:10px;">
Kuchipudi Rangapravesam
