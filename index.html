<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bhargavi & Aishwarya Poduri | Kuchipudi Rangapravesam</title>

<style>

:root{
    --navy:#081D58;
    --royal:#1E2A8A;
    --gold:#D4AF37;
    --ivory:#FFFDF7;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI, Arial, sans-serif;
    background:var(--ivory);
    color:#222;
    line-height:1.65;
}

.section{
    padding:24px 18px;
}

.center{
    text-align:center;
}

h1,h2,h3{
    color:var(--royal);
}

h2{
    margin-bottom:10px;
}

.card{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:16px;
    box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.countdown{
    background:var(--royal);
    color:white;
    text-align:center;
    padding:28px;
}

.count{
    font-size:56px;
    color:var(--gold);
    font-weight:bold;
}

.two-column{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.quick{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.quick-card{
    background:white;
    border-radius:16px;
    padding:18px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.hero-image{
    width:100%;
    max-width:800px;
    display:block;
    margin:auto;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.timeline-item{
    padding:12px 0;
    border-bottom:1px solid #eee;
}

.timeline-item:last-child{
    border-bottom:none;
}

.highlight{
    color:var(--gold);
    font-weight:bold;
}

details summary{
    cursor:pointer;
    font-weight:bold;
    color:var(--royal);
}

ul{
    padding-left:22px;
}

footer{
    background:var(--navy);
    color:white;
    text-align:center;
    padding:35px 20px;
    margin-top:20px;
}

.coming-soon{
    text-align:center;
    color:#666;
}

@media(max-width:600px){

    .two-column{
        grid-template-columns:1fr;
    }

    .count{
        font-size:46px;
    }

}

</style>
</head>

<body>

<!-- HEADER -->

<section class="section center">

<h1>Bhargavi & Aishwarya Poduri</h1>

<p style="font-size:1.2rem;margin-top:10px;">
Kuchipudi Rangapravesam
</p>

<p style="margin-top:15px;">
Presented by Kalamandapam Kuchipudi Dance School
</p>

<p>July 24, 2027</p>

<p>Renton IKEA Performing Arts Center</p>

</section>

<!-- COUNTDOWN -->

<div class="countdown">

<div class="count" id="days">--</div>

<div>DAYS UNTIL RANGAPRAVESAM</div>

</div>

<!-- GRATITUDE -->

<section class="section">

<h2 class="center">
With Gratitude
</h2>

<div class="two-column" style="margin-top:20px;">

<div class="card">

<details>

<summary>Guru ▼</summary>

<div style="margin-top:15px;">

<p><strong>Primary Guru</strong></p>

<p style="margin-top:10px;">
Smt. Sushma Yechuri
</p>

<p>
Kalamandapam Kuchipudi Dance School
</p>
